<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday Kawser 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    min-height:100vh;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:linear-gradient(135deg,#ff0080,#7928ca,#00c6ff);
    background-size:400% 400%;
    animation:bg 8s ease infinite;
    color:white;
}

@keyframes bg{
    0%{background-position:0% 50%}
    50%{background-position:100% 50%}
    100%{background-position:0% 50%}
}

.page{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    padding:20px;
}

.card{
    width:100%;
    max-width:420px;
    padding:40px 25px;
    border-radius:30px;
    background:rgba(255,255,255,.15);
    border:1px solid rgba(255,255,255,.3);
    backdrop-filter:blur(15px);
    box-shadow:0 20px 50px rgba(0,0,0,.3);
}

.step{
    display:none;
}

.step.active{
    display:block;
    animation:zoom .8s ease;
}

@keyframes zoom{
    from{
        opacity:0;
        transform:scale(.5);
    }
    to{
        opacity:1;
        transform:scale(1);
    }
}

.emoji{
    font-size:70px;
    animation:bounce 1.5s infinite;
}

@keyframes bounce{
    50%{transform:translateY(-15px) rotate(5deg)}
}

h1{
    font-size:36px;
    margin:15px 0;
    text-shadow:0 0 20px rgba(255,255,255,.8);
}

h2{
    font-size:30px;
    margin:15px 0;
}

p{
    font-size:18px;
    line-height:1.7;
}

button{
    margin-top:25px;
    padding:14px 30px;
    border:none;
    border-radius:50px;
    font-size:17px;
    font-weight:bold;
    color:#fff;
    background:linear-gradient(45deg,#ff0080,#ff8c00,#00eaff);
    background-size:200% 200%;
    animation:buttonColor 3s infinite;
    cursor:pointer;
    box-shadow:0 8px 25px rgba(0,0,0,.3);
}

@keyframes buttonColor{
    0%{background-position:0%}
    50%{background-position:100%}
    100%{background-position:0%}
}

/* Confetti */
.confetti{
    position:fixed;
    width:10px;
    height:10px;
    top:-20px;
    animation:fall linear infinite;
}

@keyframes fall{
    to{
        transform:translateY(110vh) rotate(720deg);
    }
}

/* Balloons */
.balloon{
    position:fixed;
    bottom:-100px;
    font-size:45px;
    animation:balloon 7s linear infinite;
}

@keyframes balloon{
    to{
        transform:translateY(-120vh) translateX(80px);
    }
}
</style>
</head>

<body>

<div class="page">

<div class="card">

    <!-- STEP 1 -->
    <div class="step active" id="step1">
        <div class="emoji">🎁</div>

        <h1>একটি সারপ্রাইজ আছে!</h1>

        <p>
            Kawser ভাইয়ের জন্য<br>
            একটি বিশেষ জন্মদিনের শুভেচ্ছা 🎉
        </p>

        <button onclick="nextStep()">
            🎁 Open Surprise
        </button>
    </div>


    <!-- STEP 2 -->
    <div class="step" id="step2">

        <div class="emoji">🎂</div>

        <h1>Happy Birthday!</h1>

        <h2>🎉 Kawser ভাই 🎉</h2>

        <p>
            জন্মদিনের অনেক অনেক শুভেচ্ছা ও ভালোবাসা। ❤️
            <br><br>
            আপনার জীবনের প্রতিটি দিন
            আনন্দ, সফলতা ও সুন্দর মুহূর্তে
            ভরে উঠুক।
            <br><br>
            🌟 শুভ জন্মদিন 🌟
        </p>

        <div style="font-size:45px;margin-top:20px;">
            🎈 🎊 🎂 🎊 🎈
        </div>

    </div>

</div>
</div>

<script>

/* STEP CHANGE */
function nextStep(){

    document.getElementById("step1").classList.remove("active");

    document.getElementById("step2").classList.add("active");

    createConfetti();
    createBalloons();
}


/* CONFETTI */
function createConfetti(){

    for(let i=0;i<80;i++){

        let c=document.createElement("div");

        c.className="confetti";

        c.style.left=Math.random()*100+"vw";

        c.style.animationDuration=(3+Math.random()*5)+"s";

        c.style.animationDelay=Math.random()*3+"s";

        c.style.background=
        `hsl(${Math.random()*360},100%,60%)`;

        document.body.appendChild(c);
    }
}


/* BALLOONS */
function createBalloons(){

    const emojis=["🎈","🎈","🎈","🎉","🎈"];

    for(let i=0;i<12;i++){

        let b=document.createElement("div");

        b.className="balloon";

        b.innerText=
        emojis[Math.floor(Math.random()*emojis.length)];

        b.style.left=Math.random()*100+"vw";

        b.style.animationDuration=
        (5+Math.random()*5)+"s";

        b.style.animationDelay=
        Math.random()*4+"s";

        document.body.appendChild(b);
    }
}

</script>

</body>
</html>
